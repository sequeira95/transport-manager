name: Compilar y Publicar APK Android

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'PROJECT_CONTEXT.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generar APK de TransportManager
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias npm
        run: npm ci

      - name: Compilar frontend y sincronizar Capacitor
        run: npm run build:mobile

      - name: Dar permisos de ejecucion a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Preparar binario APK para publicacion
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Passengo.apk

      - name: Publicar o Actualizar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 'Passengo Android (Ultima version)'
          body: |
            ### 📱 Passengo para Android
            Esta version se compila y actualiza automaticamente con cada cambio en el repositorio.
            
            - **Descarga directa:** Haz clic en `Passengo.apk` para instalar.
            - **Compatibilidad:** Android 8.0 o superior.
            - **Soporte:** Modo offline local y sincronizacion en la nube con Cloudflare D1.
            - **Compilacion:** ${{ github.sha }}
          files: Passengo.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
